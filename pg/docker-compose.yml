version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: gestion_restaurante
    environment:
      POSTGRES_USER: IN6AM
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in pg/.env}
      POSTGRES_DB: GestionRestaurante
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
